# Disable wifi power save on oclock.
#
# Why: with power save enabled, median RTT from CT 140 was 100-127 ms during idle
# hours (roughly one 102.4 ms beacon interval) with p99 spikes over 1 s. Disabling
# it took the median to 6.0 ms and the p99 to 33-54 ms, measured over 16 hours.
# See uptime-kuma-proxmox-handoff.md sections 28.8 and 28.10.
#
# A conf.d drop-in rather than `nmcli connection modify` because the connection is
# netplan-generated (/etc/netplan/90-NM-*.yaml) and could be regenerated. This also
# means the setting is re-applied automatically after the watchdog reloads the
# driver, which a per-connection setting would not guarantee.
#
# 0=use default  1=leave alone  2=disable  3=enable
[connection]
wifi.powersave = 2
